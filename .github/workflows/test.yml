name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tasque-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/tasque-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: git version
        run: git --version
      - name: test
        run: node --test
